<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рабочая версия</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 20px;
            color: #000;
        }
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            max-width: 850px;
        }
        .control-panel h3 { margin-top: 0; color: #333; }
        .import-box {
            width: 100%;
            height: 70px;
            margin: 10px 0;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }
        .settings-inputs {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        .settings-inputs label {
            font-size: 13px;
            font-weight: bold;
        }
        .settings-inputs input {
            width: 50px;
            padding: 3px;
            font-size: 13px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn:hover { background-color: #0056b3; }

        #screenshot-area {
            background-color: #ffffff;
            padding: 20px 30px;
            display: inline-flex;
            gap: 50px;
            align-items: flex-start;
            position: relative;
        }
        .table-wrapper {
            display: inline-block;
            vertical-align: top;
        }
        .oge-table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px; 
            font-family: Verdana, Geneva, sans-serif; 
            color: #000;
            /* ИСПРАВЛЕНИЕ: разрешаем таблице свободно менять ширину в зависимости от контента */
            table-layout: auto; 
        }
        .oge-table th {
            font-weight: bold;
            text-align: center;
            padding: 2px 5px; /* Немного увеличили боковые отступы */
            border-bottom: 1px solid #000;
            line-height: 1.2;
            font-family: Arial, sans-serif;
            font-size: 13px;
            white-space: nowrap; /* Чтобы шапка не переносилась уродливо при растяжении */
        }
        .oge-table th.center-header {
            border-bottom: none;
            padding-bottom: 4px;
            font-size: 14px;
        }
        .oge-table td {
            padding: 2px 5px; 
            text-align: center;
            vertical-align: middle;
            height: 15px; 
            white-space: nowrap; 
            /* Фикс: заставляем ячейку с инпутом растягиваться, если текст не влезает */
            max-width: 300px; 
        }
        .oge-table tr td.task-id {
            text-decoration: underline;
        }
        .table-input {
            width: 100%;
            min-width: 110px; /* Базовая минимальная ширина */
            box-sizing: border-box; /* Чтобы падинги не раздували инпут */
            border: none;
            background: transparent;
            text-align: center;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 12px;
            color: #000;
            padding: 0;
            margin: 0;
            height: 100%;
            letter-spacing: 2px; 
        }

        .table-input:focus {
            outline: 1px solid #007bff;
            background: #fff;
        }
        .right-ans-cell {
            letter-spacing: 2px;
        }
        .correct {
            background-color: #c0ffc0 !important; 
        }
        .incorrect {
            background-color: #ffc0c0 !important; 
        }
        .summary-text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            margin-top: 12px;
            color: #000;
            line-height: 1.4;
            max-width: 350px;
        }
    </style>
</head>

<!-- БЛОК УПРАВЛЕНИЯ ВАРИАНТАМИ -->
<<div style="margin: 15px 0; padding: 15px; background: #f9f9f9; border: 1px solid #ccc; border-radius: 6px; font-family: sans-serif; max-width: 850px;">

    <script>
        // Базовые массивы для хранения ОРИГИНАЛЬНЫХ данных с сайта
        var currentRightAnswers = "125,125,132,1234569,145,1234578,гуляний,утинаястая,34,24,достала".split(",");
        var currentTaskIds = "41027,28060,44903,30692,30211,26143,31596,28893,32181,28237,39802".split(",");
        
        // Два ID для С-части по умолчанию
        var currentPart2Ids = "36401,44668".split(",");

        function makeFakeWrongAnswer(correctVal, taskIndex) {
    if (!correctVal) return "24";
    
    var numString = correctVal.toString().trim();
    var currentLength = numString.length;
    var realTaskNum = taskIndex + 2; 

    // ==========================================
    // ЛОГИКА ДЛЯ ТЕКСТОВЫХ ОТВЕТОВ (Задания 8, 9, 12)
    // ==========================================
    if (isNaN(numString)) {
        var word = numString.toLowerCase().replace(/\s+/g, ''); 
        
        if (word.length > 5) {
            var chars = word.split('');
            var idx = Math.floor(Math.random() * (chars.length - 3)) + 1;
            var temp = chars[idx];
            chars[idx] = chars[idx+1];
            chars[idx+1] = temp;
            return chars.join('');
        }
        if (word.endsWith('ий') || word.endsWith('ый')) {
            return word.slice(0, -2) + 'их';
        }
        return word + 'а';
    }

    // ==========================================
    // ЛОГИКА ДЛЯ ЦИФРОВЫХ ОТВЕТОВ
    // ==========================================
    // Жёстко разделяем разрешенные цифры:
    var allowedDigits = "12345"; 
    var maxLength = 4;

    // Только в этих заданиях ОГЭ по русскому могут быть цифры до 9
    if (realTaskNum === 3 || realTaskNum === 5 || realTaskNum === 7) {
        allowedDigits = "123456789"; 
        maxLength = allowedDigits.length;
    }

    var targetLength = currentLength;
    var randMode = Math.random();
    
    if (currentLength > 1) {
        if (randMode < 0.33 && currentLength < maxLength) {
            targetLength = currentLength + 1; 
        } else if (randMode < 0.66 && currentLength > 2) {
            targetLength = currentLength - 1; 
        } 
    }

    var finalDigits = numString.split(""); 

    if (targetLength < currentLength) {
        // Ошибка недобора: убираем одну цифру
        var removeIdx = Math.floor(Math.random() * finalDigits.length);
        finalDigits.splice(removeIdx, 1);
    } 
    else if (targetLength > currentLength) {
        // Ошибка перебора: добавляем одну лишнюю цифру СТРОГО из разрешенных для этого задания
        var attempts = 0;
        while (finalDigits.length < targetLength && attempts < 50) {
            attempts++;
            var digit = allowedDigits.charAt(Math.floor(Math.random() * allowedDigits.length));
            if (!finalDigits.includes(digit)) {
                finalDigits.push(digit);
            }
        }
    } 
    else {
        // Ошибка замены: меняем одну цифру на близкую, проверяя границы allowedDigits
        var replaceIdx = Math.floor(Math.random() * finalDigits.length);
        var originalDigit = parseInt(finalDigits[replaceIdx]);
        var replaced = false;

        var offsets = [1, -1, 2, -2];
        for (var i = 0; i < offsets.length; i++) {
            var newDigit = (originalDigit + offsets[i]).toString();
            // ТЕПЕРЬ ТУТ СТРОГАЯ ПРОВЕРКА: новая цифра должна входить в allowedDigits для текущего задания
            if (allowedDigits.includes(newDigit) && !finalDigits.includes(newDigit)) {
                finalDigits[replaceIdx] = newDigit;
                replaced = true;
                break;
            }
        }

        if (!replaced) {
            for (var i = 0; i < allowedDigits.length; i++) {
                var d = allowedDigits[i];
                if (!finalDigits.includes(d)) {
                    finalDigits[replaceIdx] = d;
                    break;
                }
            }
        }
    }

    // Сортировка по правилам ОГЭ (все задания кроме 4)
    var finalFake = "";
    if (realTaskNum === 4) {
        finalFake = finalDigits.join(""); 
    } else {
        finalFake = finalDigits.sort().join(""); 
    }

    // Если совпало с оригиналом, точечно меняем последний символ из разрешенного набора
    if (finalFake === numString) {
        var extraDigits = allowedDigits.split("").filter(function(d) { return !numString.includes(d); });
        if (extraDigits.length > 0) {
            finalFake = finalFake.substring(0, finalFake.length - 1) + extraDigits[0];
        } else {
            // Флбэк для экзотических случаев
            finalFake = finalFake.includes("5") ? finalFake.replace("5", "4") : finalFake + "5";
        }
        
        if (realTaskNum !== 4) {
            finalFake = finalFake.split("").sort().join("");
        }
    }

    // Дополнительный сэйф-чек: если для обычного задания длина или символы вылетели за рамки
    if (realTaskNum !== 3 && realTaskNum !== 5 && realTaskNum !== 7 && realTaskNum !== 4) {
        // Убираем любые цифры больше 5, если они каким-то чудом пролезли
        finalFake = finalFake.split("").filter(function(d) { return "12345".includes(d); }).join("");
        if (finalFake.length > 4) finalFake = finalFake.substring(0, 4);
    }
    if (finalFake.length < 2 && realTaskNum !== 11 && realTaskNum !== 12 && !isNaN(numString)) {
        finalFake = "24";
    }

    return finalFake;
}




        function parseAndImport() {
            var rawText = document.getElementById("rawImportText").value;
            if (!rawText.trim()) {
                renderTables();
                return;
            }

            var lines = rawText.split("\n");
            var tempAnswers = [];
            var tempTaskIds = [];
            var tempPart2Ids = [];

            for (var i = 0; i < lines.length; i++) {
                var clean = lines[i].trim();
                if (!clean) continue;
                if (clean.includes("Тестовая") || clean.includes("Правильный") || clean.includes("Ваш") || clean.includes("ответ")) continue;

                var tokens = clean.split(/\s+/);
                
                // Если это полноценная строчка из таблицы РЕШУ ОГЭ
                if (tokens.length >= 3) {
                    var ogeNumber = parseInt(tokens[0]) || 0;
                    var ogeId = tokens[1].trim();
                    var potentialAnswer = tokens[tokens.length - 1].trim();

                if (potentialAnswer !== "ответ" && potentialAnswer !== "Ваш" && potentialAnswer !== "") {
                    if (ogeNumber === 1 || ogeNumber === 13) {
                        tempPart2Ids.push(ogeId);
                    } else {
                        tempAnswers.push(potentialAnswer);
                        tempTaskIds.push(ogeId);
                    }
                }
            }
        }
        if (tempAnswers.length > 0) {
            currentRightAnswers = tempAnswers;
            currentTaskIds = tempTaskIds;
        }
        if (tempPart2Ids.length > 0) {
            currentPart2Ids = tempPart2Ids;
        }
        renderTables();
    }

   function renderTables() {
    var testTbody = document.getElementById("test-tbody");
    testTbody.innerHTML = "";
    var requestedErrors = parseInt(document.getElementById("autoErrorsInput").value) || 0;
    var digitalIndices = "";
    var digitalCount = 0;
    for (var k = 0; k < currentRightAnswers.length; k++) {
        if (!isNaN(currentRightAnswers[k])) {
            digitalIndices += k + ",";
            digitalCount++;
        }
    }
    if (requestedErrors > digitalCount) requestedErrors = digitalCount;
    var autoErrorIndices = "";
    var errorsPicked = 0;
    var digitalSplit = digitalIndices.split(",");
    while (errorsPicked < requestedErrors && digitalCount > 0) {
        var randIndexStr = digitalSplit[Math.floor(Math.random() * digitalCount)];
        if (randIndexStr !== "" && !autoErrorIndices.includes(randIndexStr + ",")) {
            autoErrorIndices += randIndexStr + ",";
            errorsPicked++;
        }
    }
        for (var i = 0; i < currentRightAnswers.length; i++) {
        var tr = document.createElement("tr");
        var tdIndex = document.createElement("td");
        tdIndex.textContent = i + 2;
        var tdId = document.createElement("td");
        tdId.className = "task-id";
        tdId.textContent = i < currentTaskIds.length ? currentTaskIds[i] : "00000";
        
        var tdYour = document.createElement("td");
        
        // === ПЕРЕВОДИМ НА СТОПРОЦЕНТНУЮ РЕАЛИСТИЧНОСТЬ (БЕЗ ТЕГА INPUT) ===
        tdYour.className = "right-ans-cell"; // Даем те же стили текста, что и у правого столбца
        tdYour.style.height = "15px";
        tdYour.style.padding = "2px 10px"; // Даем отступы по бокам для красоты
        tdYour.setAttribute("contenteditable", "true"); // Делаем текст редактируемым, если надо поменять руками
        tdYour.style.outline = "none"; // Убираем рамку при фокусе
        
        // Генерируем правильный ответ или наш умный фейк
        if (autoErrorIndices.includes(i.toString() + ",")) {
            tdYour.textContent = makeFakeWrongAnswer(currentRightAnswers[i], i);
            tdYour.classList.add("incorrect");
        } else {
            tdYour.textContent = currentRightAnswers[i];
            tdYour.classList.add("correct");
        }
        
        tdYour.id = "your-ans-" + i; // Жестко привязываем ID к ячейке, чтобы функция выше её нашла
        tdYour.oninput = (function(index) { 
            return function() { 
                updateRowStatus(index); 
            }; 
        })(i);
        // ==================================================================

        var tdRight = document.createElement("td");
        tdRight.className = "right-ans-cell";
        tdRight.id = "right-ans-" + i;
        tdRight.textContent = currentRightAnswers[i];
        
        tr.appendChild(tdIndex); 
        tr.appendChild(tdId); 
        tr.appendChild(tdYour); 
        tr.appendChild(tdRight);
        testTbody.appendChild(tr);
    }

    var part2Tbody = document.getElementById("part2-tbody");
    part2Tbody.innerHTML = "";
    var part2Fails = parseInt(document.getElementById("part2FailsInput").value) || 0;
    var part2Configs = [{p: 1, m: 6}, {p: 13, m: 16}];
    for (var j = 0; j < part2Configs.length; j++) {
        var tr2 = document.createElement("tr");
        var tdIndex2 = document.createElement("td");
        tdIndex2.className = "task-pp";
        tdIndex2.textContent = part2Configs[j].p;
        var tdId2 = document.createElement("td");
        tdId2.className = "task-id";
        tdId2.textContent = j < currentPart2Ids.length ? currentPart2Ids[j] : "00000";
        var tdYourBall = document.createElement("td");
        var inputBall = document.createElement("input");
        inputBall.type = "text";
        inputBall.className = "table-input";
        inputBall.id = "your-ball-" + j;
        if (j < part2Fails) { inputBall.value = "0"; tdYourBall.className = "incorrect"; }
        else { inputBall.value = part2Configs[j].m; tdYourBall.className = "correct"; }
        inputBall.oninput = recalculateTotal;
        tdYourBall.appendChild(inputBall);
        var tdMaxBall = document.createElement("td");
        tdMaxBall.id = "max-ball-" + j;
        tdMaxBall.textContent = part2Configs[j].m;
        tr2.appendChild(tdIndex2); tr2.appendChild(tdId2); tr2.appendChild(tdYourBall); tr2.appendChild(tdMaxBall);
        part2Tbody.appendChild(tr2);
    }
    recalculateTotal();
}


    function updateRowStatus(index) {
    var yourCell = document.getElementById("your-ans-" + index);
    var rightCell = document.getElementById("right-ans-" + index);
    
    if (!yourCell || !rightCell) return; // Защита от ошибок, если ячейка не нашлась

    var userVal = yourCell.textContent.trim(); // Считываем текст напрямую из ячейки (без .value)
    var rightVal = rightCell.textContent.trim();

    // Красим саму ячейку в нужный класс, сохраняя шрифт Verdana (right-ans-cell)
    if (userVal === rightVal) { 
        yourCell.className = "right-ans-cell correct"; 
    } else { 
        yourCell.className = "right-ans-cell incorrect"; 
    }
    
    recalculateTotal();
}


    function recalculateTotal() {
        var testCorrect = 0;
        var totalTasks = currentRightAnswers.length + 2;
        for (var i = 0; i < currentRightAnswers.length; i++) {
            var yourInput = document.getElementById("your-ans-" + i);
            var rightVal = document.getElementById("right-ans-" + i).textContent.trim();
            if (yourInput && yourInput.value.trim() === rightVal) { testCorrect++; }
        }
        var part2Points = 0;
        var solvedPart2Count = 0;
        for (var j = 0; j < 2; j++) {
            var ballInput = document.getElementById("your-ball-" + j);
            var currentBall = parseInt(ballInput ? ballInput.value : 0) || 0;
            var tdCell2 = ballInput ? ballInput.parentElement : null;
            if (tdCell2) {
                if (currentBall === 0) { tdCell2.className = "incorrect"; }
                else { tdCell2.className = "correct"; solvedPart2Count++; }
            }
            part2Points = part2Points + currentBall;
        }
        var finalSolved = testCorrect + solvedPart2Count;
        var finalScore = testCorrect + part2Points;
        var summary = document.getElementById("summary-info");
        summary.innerHTML = "Решено " + finalSolved + " из " + totalTasks + " заданий, набрано " + finalScore + " первичных баллов.";
    }

    renderTables();
// Автоматическая загрузка списка вариантов при старте страницы
document.addEventListener("DOMContentLoaded", function() {
    updateVariantDropdown();
});

// Функция обновления выпадающего списка кнопками
function updateVariantDropdown() {
    var selector = document.getElementById('variantSelector');
    // Очищаем всё, кроме первой дефолтной строки
    selector.innerHTML = '<option value="">-- Выбери вариант из списка --</option>';
    
    // Достаем сохраненные варианты из памяти браузера
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    
    for (var varName in savedVariants) {
        var option = document.createElement('option');
        option.value = varName;
        option.textContent = varName;
        selector.appendChild(option);
    }
}

// Функция сохранения нового варианта в базу данных браузера
function saveNewVariant() {
    var name = document.getElementById('newVariantName').value.trim();
    var text = document.getElementById('newVariantText').value.trim();
    
    if (!name || !text) {
        alert("Заполните и название, и текст варианта!");
        return;
    }
    
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    savedVariants[name] = text; // Привязываем текст к названию
    
    localStorage.setItem('oge_my_variants', JSON.stringify(savedVariants));
    
    // Очищаем форму и обновляем кнопку выбора вариантов
    document.getElementById('newVariantName').value = '';
    document.getElementById('newVariantText').value = '';
    document.getElementById('addVariantPanel').style.display = 'none';
    
    updateVariantDropdown();
    alert("Вариант '" + name + "' успешно добавлен в список!");
}

// Переключение варианта: берет текст и кормит его твоему родному коду
function loadSelectedVariant() {
    var selector = document.getElementById('variantSelector');
    var selectedName = selector.value;
    
    if (!selectedName) return;
    
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    var rawText = savedVariants[selectedName];
    
    if (rawText) {
        // 1. Находим твое верхнее текстовое поле. 
        // В оригинальном коде у него id="rawInput" (или найди его textarea)
        var mainTextarea = document.getElementById('rawInput') || document.querySelector('textarea');
        
        if (mainTextarea) {
            // Записываем сохраненный текст в поле ввода
            mainTextarea.value = rawText;
            
            // 2. Имитируем клик по твоей синей кнопке «Распознать и сгенерировать»
            // Ищем синюю кнопку по тексту на ней
            var allButtons = document.querySelectorAll('button');
            var generateButton = null;
            
            for (var i = 0; i < allButtons.length; i++) {
                if (allButtons[i].textContent.includes('Распознать и сгенерировать')) {
                    generateButton = allButtons[i];
                    break;
                }
            }
            
            // Если кнопку нашли — кликаем, и скриншот мгновенно обновляется!
            if (generateButton) {
                generateButton.click();
            } else {
                // Флбэк: если кнопка не нажалась, просто выведем алерт, что текст на месте
                alert("Текст вставлен в поле! Нажми синюю кнопку 'Распознать и сгенерировать'.");
            }
        } else {
            alert("Не удалось найти поле для ввода текста на странице.");
        }
    }
}

document.addEventListener("DOMContentLoaded", function() {
    updateVariantDropdown();
    checkAdminSession(); // Проверяем, залогинен ли ты уже
});

// Проверка сессии админа (чтобы не вводить пароль при каждой перезагрузке)
function checkAdminSession() {
    if (sessionStorage.getItem("is_oge_admin") === "true") {
        document.getElementById('addVariantPanel').style.display = 'block';
        document.getElementById('adminDeleteBtn').style.display = 'block';
    }
}

// Вход в панель управления
// Вход в панель управления с жестко прописанным паролем
function authAdmin() {
    var pass = prompt("Введите пароль администратора:");
    
    // Проверяем введенный текст напрямую, без использования внешних переменных
    if (pass === "ventillator") { 
        sessionStorage.setItem("is_oge_admin", "true");
        document.getElementById('addVariantPanel').style.display = 'block';
        document.getElementById('adminDeleteBtn').style.display = 'block';
        alert("Доступ разрешен. Кнопки добавления и удаления активны!");
    } else if (pass !== null) {
        alert("Неверный пароль!");
    }
}

// Выход из админки (панель снова скроется)
function logoutAdmin() {
    sessionStorage.removeItem("is_oge_admin");
    document.getElementById('addVariantPanel').style.display = 'none';
    document.getElementById('adminDeleteBtn').style.display = 'none';
}

// Обновление списка в меню
function updateVariantDropdown() {
    var selector = document.getElementById('variantSelector');
    selector.innerHTML = '<option value="">-- Выбери вариант из списка --</option>';
    
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    
    for (var varName in savedVariants) {
        var option = document.createElement('option');
        option.value = varName;
        option.textContent = varName;
        selector.appendChild(option);
    }
}

// Сохранение нового варианта
function saveNewVariant() {
    var name = document.getElementById('newVariantName').value.trim();
    var text = document.getElementById('newVariantText').value.trim();
    
    if (!name || !text) {
        alert("Заполните все поля!");
        return;
    }
    
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    savedVariants[name] = text;
    
    localStorage.setItem('oge_my_variants', JSON.stringify(savedVariants));
    
    document.getElementById('newVariantName').value = '';
    document.getElementById('newVariantText').value = '';
    
    updateVariantDropdown();
    alert("Вариант успешно добавлен!");
}

// Удаление выбранного варианта
function deleteCurrentVariant() {
    var selector = document.getElementById('variantSelector');
    var selectedName = selector.value;
    
    if (!selectedName) {
        alert("Сначала выбери вариант, который хочешь удалить!");
        return;
    }
    
    if (confirm("Ты точно хочешь безвозвратно удалить '" + selectedName + "'?")) {
        var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
        delete savedVariants[selectedName]; // Удаляем из базы
        
        localStorage.setItem('oge_my_variants', JSON.stringify(savedVariants));
        updateVariantDropdown();
        
        // Очищаем форму ввода
        var mainTextarea = document.getElementById('rawImportText') || document.querySelector('textarea');
        if (mainTextarea) mainTextarea.value = '';
        
        alert("Вариант удален.");
    }
}

// Загрузка варианта в таблицу
function loadSelectedVariant() {
    var selector = document.getElementById('variantSelector');
    var selectedName = selector.value;
    if (!selectedName) return;
    
    var savedVariants = JSON.parse(localStorage.getItem('oge_my_variants')) || {};
    var rawText = savedVariants[selectedName];
    
    if (rawText) {
        var mainTextarea = document.getElementById('rawImportText') || document.querySelector('textarea');
        if (mainTextarea) {
            mainTextarea.value = rawText;
            
            // Сами триггерим твою родную функцию парсинга
            if (typeof parseAndImport === "function") {
                parseAndImport();
            }
        }
    }
}
